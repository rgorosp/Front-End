<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exercicio de Links e Imagens</title>
</head>
<body>
	<!-- Ancora para Voltar ao Topo -->
	<div id="Topo"></div>

	<h1>Exercicio de Links e Imagens</h1>

	<!-- Link Abrindo em Nova Aba -->
	<p>
		<a href="https://www.google.com/" target="">
		Visite o Google
	    </a>
    </p>

    <!-- Imagem com Atributo ALT -->
    <h2>Exemplo de Imagem</h2>

    	<img src='https://www.ionos.com/pt-br/digitalguide/fileadmin/_processed_/7/5/csm_hyperlink-t_c7e98fa8e8.webp' width="300" height="400" alt="Imagem ilustrativa de exemplo com fundo cinza"
        width="300" />

    </br></br>

    <!-- Link que leva ao topo da propria pagina -->

    <p>
    	<a href="#Topo">Voltar ao topo</a>
    </p>
</body>
</html>
