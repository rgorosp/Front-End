<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exemplo com colspan e rowspan</title>
</head>
<body>
	<h2 style="text-align: center;">Exemplo com colspan e rowspan</h2>

	<table width="400" align="center" border="2">
		
		<!-- Primeira Linha com Colspan -->
		<tr>
			<th colspan="3">Cronograma Semanal</th>
		</tr>

		<!-- Cabeçalho Normal -->
		<tr>
			<th>Dia</th>
			<th>Horario</th>
			<th>Atividade</th>
		</tr>

		<!-- Usando Rowspan -->
		<tr>
			<th rowspan="2">Segunda-Feira</th>
			<td>08:00 - 09:00</td>
			<td>HTML</td>
		</tr>

		<tr>
			<td>09:00 - 10:00</td>
			<td>CSS</td>
		</tr>

		<tr>
			<th>Terça-Feira</th>
			<td>08:00 - 09:00</td>
			<td>Java-Script</td>
		</tr>
	</table>
</body>
</html>
