<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Explorando TAGS HTML</title>
</head>
<body>

	<h1>Explorando TAGS HTML</h1>

	<h2>Seção 1</h2>
	<h3>Subseção 1.1</h3>

	<p>Comece a aprender as Tags em HTML como Titulos, Formularios, Indices, Divisões, e agora vamos partir para o CSS.
	</p>
	
	<h2>Lista não Ordenada</h2>
		<ul> <!-- Containder da Lista -->
			<li>Jiló</li>
			<li>Xuxu</li>
			<li>Estrogonofre</li>
		</ul>

    <h2>Lista Ordenada</h2>
    	<ol> <!-- Containder da Lista -->
    		<li>Macarrão</li>
    		<li>Comida Japonesa</li>
    		<li>Pizza</li>
    	</ol>
    <!-- "li" seria os itens da lista -->
</body>
</html>
