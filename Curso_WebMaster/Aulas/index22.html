<!DOCTYPE html>
<html>
<head>
	<meta translate="pt-br">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/style22.css">
	<title>Criando formulário de contato profissional</title>
</head>
<body>
	<form>
		<fieldset>
			<legend>Meu Grupo do Formulario</legend>
			<input type="text" name="Nome" value=" Nome" placeholder="Escreva seu nome: ">
			<input type="text" name="Sobrenome" value=" Sobrenome" placeholder="Escreva seu sobrenome: ">
			<div class="select">
			<select name="listas">
				<option disabled selected>Qual a sua idade? </option>
				<option value="<18"><18</option>
				<option value="=18">>=18</option>
				<option value=">50">>50</option>
			</select>
			<h2>Qual a sua cidade? </h2>
			<div class="form">
				<div>
					<input type="radio" name="Cidade" value="Florianopolis" />
					<span>Florianopolis</span>
				</div>
				<div>
					<input type="radio" name="Cidade"value="Rio de Janeiro" />
					<span>Rio de Janeiro</span>
				</div>
				<div>
					<input type="radio" name="Cidade"value="São Paulo" />
					<span class="sp">São Paulo</span>
				</div>
				</div>

			<h2>O que você gosta de comer? </h2>
			<div class="form1">
				<div>
					<input type="checkbox" name="Frutas[]" value="Saladas" />
					<span>Saladas</span>
				</div>
				<div>
					<input type="checkbox" name="Frutas[]"value="FastFood" />
					<span>FastFood</span>
				</div>
				<div>
					<input type="checkbox" name="Frutas[]"value="Grelhados" />
					<span>Grelhados</span>
				</div>
				</div>
			</div>
			<div>
				<input type="submit" name="Enviar">
			</div>
			<h2>Digite seus comentarios!</h2>
			<div>
				<textarea placeholder="Escreva seus comentarios"></textarea>
			</div>

			</div>
		</fieldset>
	</form>
</body>
</html>
