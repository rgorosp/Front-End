<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Exemplo In-Line e Formatado</title>

	<style type="text/css">
		/* Estilizado via CSS */
		h3{
			color: blue;
			font-size: 10px;
		}
	</style>

</head>
<body>
	<!-- Estilizado IN-LINE -->
	<h1 style="color: red;font-size: 50px;">Meu Primeiro Texto</h1>
	<h2 style="color: lightgray;font-size: 30px;">Meu Segunto Texto</h2>
	<h3>Meu Terceiro Texto</h3>
</body>

</html>
