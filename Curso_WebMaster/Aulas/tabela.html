<!DOCTYPE html>
<html lang="pt-br">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Criar uma Tabela Com Atributos</title>
</head>
<body>
	
	<h2 style="text-align: center;">Criar uma Tabela com Atributos</h2>

	<table width="400" align="center" border="1">

		<thead style="background-color: lightgray;">
			<tr>
				<td>Nome</td>
				<td>Idade</td>
				<td>Cidade</td>
			</tr>
		</thead>

		<tbody>
			<tr>
				<td>Emerson</td>
				<td>50</td>
				<td>São Paulo</td>
			</tr>
			<tr>
				<td>Livia</td>
				<td>18</td>
				<td>São Paulo</td>
			</tr>
			<tr>
				<td>Marilene</td>
				<td>71</td>
				<td>São Paulo</td>
			</tr>	
		</tbody>	
	</table>
</body>
</html>
