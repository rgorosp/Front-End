<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html,body{margin:0;height:100%;background:transparent}
  three-d-stage:not(:defined){visibility:hidden}
  three-d-stage{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<three-d-stage name="forma-suica" background="#14100c" autorotate></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
import * as THREE from "three";

const stage = document.querySelector('three-d-stage');
const { THREE: T } = await stage.ready;

const group = new T.Group();

const metal = new T.MeshStandardMaterial({ color: 0xd6d8db, metalness: 0.38, roughness: 0.4, name: 'aluminio-fosco', side: T.DoubleSide });
const metalBrushed = new T.MeshStandardMaterial({ color: 0xbfc2c6, metalness: 0.34, roughness: 0.55, name: 'aluminio-escovado', side: T.DoubleSide });

// "forma suíça" — cup-shaped ring pan, built as a lathe profile (inner
// floor -> inner wall -> rolled rim -> outer wall -> outer base). The
// center cone is a separate CylinderGeometry: LatheGeometry smooths
// normals along the whole profile, which turned a flat-topped cone into
// a rounded dome — a cylinder's caps keep their own crisp, unsmoothed
// edges instead.
const profile = [
  new T.Vector2(0.06, 0.0),
  new T.Vector2(0.085, 0.0),
  new T.Vector2(0.09, 0.006),
  new T.Vector2(0.114, 0.1),
  new T.Vector2(0.124, 0.108),
  new T.Vector2(0.128, 0.1),
  new T.Vector2(0.118, 0.01),
  new T.Vector2(0.1, 0.0)
];
const lathe = new T.LatheGeometry(profile, 64);
const pan = new T.Mesh(lathe, metalBrushed);
pan.name = 'forma_suica';
pan.castShadow = true; pan.receiveShadow = true;
group.add(pan);

// center cone: flat-topped frustum, sitting base-down on the inner floor
const coneGeo = new T.CylinderGeometry(0.045, 0.06, 0.045, 64);
const cone = new T.Mesh(coneGeo, metalBrushed);
cone.position.y = 0.0225;
cone.name = 'cone_central';
cone.castShadow = true; cone.receiveShadow = true;
group.add(cone);

// bottom cap to close the underside
const capGeo = new T.CircleGeometry(0.1, 64);
const cap = new T.Mesh(capGeo, metal);
cap.rotation.x = Math.PI / 2;
cap.position.y = 0.0005;
cap.name = 'fundo';
cap.receiveShadow = true;
group.add(cap);

group.position.y = 0;
stage.setObject(group);
</script>
</body>
</html>
